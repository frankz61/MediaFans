[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediafans"
version = "0.1.0"
description = "网盘搜索 / 转存 / 直链播放一体化 CLI（Agent 化第一步）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# AI 裁决是可选增强：不装也能用，资源验证和排序都是确定性的
ai = ["anthropic>=0.40"]

[project.scripts]
mediafans = "mediafans.cli:main"

[tool.setuptools.packages.find]
include = ["mediafans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
